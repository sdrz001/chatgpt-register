<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户管理 · ChatGPT 注册管理</title>
<link rel="stylesheet" href="/static/style.css?v=21">
</head>
<body data-page="accounts">
<div class="layout">
  <main class="main">
    <h1 class="page-title">账户管理</h1>

    <!-- 注册进度概览 -->
    <div class="produce-bar" id="produce-bar">
      <div class="produce-stat"><span class="produce-num" id="pd-pending">0</span><span class="produce-lbl">待注册</span></div>
      <span class="produce-dot">·</span>
      <div class="produce-stat"><span class="produce-num running" id="pd-running">0</span><span class="produce-lbl">在跑</span></div>
      <span class="produce-dot">·</span>
      <div class="produce-stat"><span class="produce-num ok" id="pd-registered">0</span><span class="produce-lbl">已注册</span></div>
      <span class="produce-dot">·</span>
      <div class="produce-stat"><span class="produce-num bad" id="pd-failed">0</span><span class="produce-lbl">注册失败</span></div>
      <div class="produce-actions">
        <button class="px-btn danger" id="pd-stop" style="display:none" onclick="stopProduce()">停止</button>
      </div>
    </div>

    <div class="toolbar">
      <input id="search" class="px-input search" placeholder="搜索 email / 备注 ...">
      <select id="filter-status" class="px-input">
        <option value="">全部注册状态</option>
        <option value="registering">注册中</option>
        <option value="registered">已注册</option>
        <option value="register_failed">注册失败</option>
        <option value="already_registered">停用</option>
      </select>
      <select id="filter-at-status" class="px-input">
        <option value="">全部 AT 状态</option>
        <option value="valid">AT 有效</option>
        <option value="invalid">AT 失效</option>
        <option value="unchecked">AT 待检测</option>
        <option value="checking">AT 检测中</option>
        <option value="error">AT 检测失败</option>
        <option value="missing">无 AT</option>
      </select>
      <select id="filter-plan" class="px-input">
        <option value="">全部套餐</option>
        <option value="free">Free</option>
        <option value="go">Go</option>
        <option value="plus">Plus</option>
        <option value="pro">Pro</option>
        <option value="team">Team</option>
        <option value="business">Business</option>
        <option value="enterprise">Enterprise</option>
        <option value="edu">Edu</option>
      </select>
      <select id="filter-trial-status" class="px-input">
        <option value="">全部试用资格</option>
        <option value="eligible">有资格</option>
        <option value="ineligible">无资格</option>
        <option value="unchecked">试用资格待检测</option>
        <option value="checking">试用资格检测中</option>
        <option value="error">试用资格检测失败</option>
      </select>
      <select id="filter-register-country" class="px-input">
        <option value="">全部注册地</option>
        <option value="unknown">注册地未知</option>
      </select>
      <select id="filter-account-category" class="px-input">
        <option value="">全部分类</option>
        <option value="uncategorized">未分类</option>
      </select>
      <button class="px-btn" onclick="openCategoryModal()">分类管理</button>
      <div class="register-controls">
        <select id="register-scope" class="px-input" onchange="updateRegisterScope()">
          <option value="all">全部邮箱</option>
          <option value="category">邮箱分组</option>
          <option value="mailboxes">指定邮箱</option>
        </select>
        <select id="register-category" class="px-input" style="display:none">
          <option value="">选择邮箱分组</option>
        </select>
        <div id="register-mailbox-picker" class="mailbox-picker" style="display:none">
          <button id="register-mailbox-btn" class="px-btn mailbox-picker-btn" type="button" onclick="toggleMailboxPicker(event)">选择邮箱</button>
          <div id="register-mailbox-panel" class="mailbox-picker-panel" onclick="event.stopPropagation()">
            <input id="register-mailbox-search" class="px-input" placeholder="搜索邮箱" oninput="renderRegisterMailboxes()">
            <div class="mailbox-picker-actions">
              <button class="px-btn ghost" type="button" onclick="selectVisibleRegisterMailboxes()">全选结果</button>
              <button class="px-btn ghost" type="button" onclick="clearRegisterMailboxes()">清空</button>
            </div>
            <div id="register-mailbox-options" class="mailbox-picker-options"></div>
          </div>
        </div>
        <select id="register-proxy-pool" class="px-input" aria-label="注册代理池" title="本次注册使用的代理池">
          <option value="0">直连</option>
        </select>
        <input id="register-count" class="px-input register-count" type="number" min="1" value="10" aria-label="注册数量" title="注册数量">
        <button class="px-btn primary" id="produce-btn" onclick="startProduce()">注册</button>
      </div>
    </div>

    <div class="batch-bar" id="acc-batch" style="display:none">
      <span id="acc-batch-count">已选 0 项</span>
      <button class="px-btn primary" onclick="copySelectedAT()">复制 AT</button>
      <button class="px-btn" onclick="copySelectedMailboxLinks()">复制邮箱----取件URL</button>
      <button class="px-btn" onclick="checkSelectedAT()">检测 AT / 试用资格</button>
      <button class="px-btn" id="batch-plus-mail-btn" onclick="checkSelectedPlusMail()">检查 Plus 邮件</button>
      <span id="plus-mail-progress" style="display:none"></span>
      <select id="batch-account-category" class="px-input batch-select" onchange="assignSelectedCategory(this.value)">
        <option value="">批量归类</option>
        <option value="uncategorized">移出分类</option>
      </select>
      <button class="px-btn" onclick="downloadSelected()">批量下载</button>
      <button class="px-btn danger" onclick="delSelected()">删除所选</button>
      <button class="px-btn ghost" onclick="clearSelection()">取消</button>
    </div>

    <div class="table-wrap">
      <table class="px-table">
        <thead><tr>
          <th class="col-check"><input type="checkbox" id="acc-check-all" onclick="toggleSelectAll(this.checked)"></th>
          <th>邮箱</th><th>分类</th><th>注册地</th><th>AT 状态</th><th>套餐</th><th>0元试用</th><th>Plus 邮件</th><th>注册状态</th><th>Codex</th><th>Sub2API</th><th>出库</th><th>操作</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<!-- 分类管理 modal -->
<div class="modal-mask" id="category-modal" style="display:none">
  <div class="modal px-panel" style="width:520px">
    <h2>账户分类管理</h2>
    <div class="category-create-row">
      <input id="new-account-category" class="px-input" maxlength="64" placeholder="输入新分类名称">
      <button class="px-btn primary" onclick="createAccountCategory()">新增</button>
    </div>
    <div id="account-category-list" class="category-list"></div>
    <div class="modal-actions">
      <button class="px-btn" onclick="closeModal('category-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- 日志 modal -->
<div class="modal-mask" id="log-modal" style="display:none">
  <div class="modal px-panel" style="width:640px">
    <h2 id="log-title">执行日志</h2>
    <pre id="log-body" class="log-body"></pre>
    <div class="modal-actions">
      <button class="px-btn ghost" id="log-shot-btn" style="display:none;margin-right:auto" onclick="viewShot()">异常截图</button>
      <button class="px-btn" onclick="closeLog()">关闭</button>
    </div>
  </div>
</div>

<!-- 异常截图 modal -->
<div class="modal-mask" id="shot-modal" style="display:none">
  <div class="modal px-panel" style="width:900px;max-width:94vw">
    <h2 id="shot-title">异常截图</h2>
    <div style="max-height:70vh;overflow:auto;background:#000">
      <img id="shot-img" style="display:block;width:100%" alt="异常截图">
    </div>
    <div class="modal-actions">
      <button class="px-btn" onclick="closeShot()">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="/static/layout.js?v=2"></script>
<script src="/static/accounts.js?v=24"></script>
</body>
</html>
